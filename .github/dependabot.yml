version: 2
updates:
  - package-ecosystem: github-actions
    # Workflows and the local composite actions (azure-login pins azure/login).
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
  # Add the app's own ecosystem (npm, uv, pip...) when the real app lands.
